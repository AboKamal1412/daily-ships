[package]
name = "daily-ships"
version = "2.0.0"
edition = "2021"
description = "Shows one random Second World War warship in a small popup, then exits."
build = "build.rs"
publish = false

[dependencies]
# GUI. Default features are off: no accesskit, no bundled fonts (we load the
# Windows system fonts at runtime), no persistence, no wgpu. Only the small
# OpenGL (glow) renderer is compiled in.
eframe = { version = "0.31.1", default-features = false, features = ["glow"] }
# JPEG decoding only.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"     # optimise for size
lto = true          # whole-program link-time optimisation
codegen-units = 1
strip = true        # strip symbols
panic = "abort"     # no unwinding tables
